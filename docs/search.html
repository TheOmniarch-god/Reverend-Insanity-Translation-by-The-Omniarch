<main class="search-wrap">
  <div class="search-head">
    <h1>Search</h1>
    <p class="search-sub">Type a name, a Gu, or a phrase to jump straight to the line.</p>
  </div>

  <div class="search-bar">
    <input class="search-input" id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="Search chapters… e.g. moon orchids, Spring Autumn Cicada, aperture" aria-label="Search">
  </div>

<script src="app.js?v=20261004-rank-bold-royal"></script>
<script>
  (function () {
    var input = document.getElementById("q");
    var countEl = document.getElementById("searchCount");
    var resultsEl = document.getElementById("searchResults");
    var DATA = null;

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function titleOf(num) {
      for (var i = 0; i < DATA.chapters.length; i++) {
        if (DATA.chapters[i].num === num) return DATA.chapters[i].title;
      }
      return "";
    }

    fetch("search-index.json").then(function (r) { return r.json(); }).then(function (d) {
      DATA = d;
      var hasPreface = d.paras.some(function (p) { return p.c === "preface"; });
      countEl.textContent = d.paras.length + " paragraphs indexed across " +
        (hasPreface ? "the author\u2019s preface and " : "") +
        d.chapters.length + " chapter" + (d.chapters.length === 1 ? "" : "s") + ".";
      // if someone typed while the index was still downloading, run it now
      if (input.value.trim().length >= 2) runSearch();
    }).catch(function () {
      countEl.textContent = "The search index could not be loaded.";
    });

    function runSearch() {
      if (!DATA) return;
      var q = input.value.trim().toLowerCase();
      resultsEl.innerHTML = "";
      if (q.length < 2) {
        countEl.textContent = "Type at least two characters…";
        return;
      }
      var hits = [];
      for (var i = 0; i < DATA.paras.length; i++) {
        var low = DATA.paras[i].t.toLowerCase();
        var pos = low.indexOf(q);
        if (pos === -1) continue;
        var n = 0, j = pos;
        while (j !== -1) { n++; j = low.indexOf(q, j + q.length); }
        hits.push({ d: DATA.paras[i], pos: pos, n: n });
      }
      hits.sort(function (a, b) { return b.n - a.n || a.d.c - b.d.c || a.d.p - b.d.p; });
      var top = hits.slice(0, 60);
      countEl.textContent = hits.length + " matching paragraph" + (hits.length === 1 ? "" : "s") +
        (top.length < hits.length ? " — showing the top " + top.length : "") + ".";
      if (!top.length) {
        resultsEl.innerHTML = '<div class="search-empty">No matches. Try a name, a Gu, or a phrase from the text.</div>';
        return;
      }
      var safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      var re = new RegExp("(" + safeQ + ")", "ig");
      var html = "";
      for (var k = 0; k < top.length; k++) {
        var h = top[k];
        var raw = h.d.t;
        var start = Math.max(0, h.pos - 70);
        var end = Math.min(raw.length, h.pos + q.length + 100);
        var snippet = (start > 0 ? "…" : "") + raw.slice(start, end) + (end < raw.length ? "…" : "");
        var safe = esc(snippet).replace(re, "<mark>$1</mark>");
        var link = (h.d.c === "preface") ? "preface#p" + h.d.p : "chapter-" + h.d.c + "#p" + h.d.p;
        var label = (h.d.c === "preface") ? "Author&#8217;s Preface" : "Chapter " + h.d.c + " · " + esc(titleOf(h.d.c));
        html += '<a class="sr-card" href="' + link + '">' +
          '<div class="sr-meta">' + label + '</div>' +
          '<div class="sr-text">' + safe + '</div></a>';
      }
      resultsEl.innerHTML = html;
    }

    // a shared link like /search?q=moon%20orchid pre-fills the box;
    // the index finishes loading and the pending query runs itself
    try {
      var initial = new URLSearchParams(window.location.search).get("q");
      if (initial) input.value = initial;
    } catch (e) { /* older browser: no shareable search links */ }

    var timer = null;
    input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(runSearch, 140);
    });

    var chips = document.querySelectorAll(".search-chip");
    for (var c = 0; c < chips.length; c++) {
      chips[c].addEventListener("click", function () {
        input.value = this.getAttribute("data-q");
        runSearch();
        input.focus();
      });
    }
  })();
</script>
